name: Deploy para VPS

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'deploy/*.example.yml'
      - '.gitignore'
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Enviar codigo para a VPS (rsync via SSH)
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude '.git' --exclude 'node_modules' --exclude 'deploy/docker-stack.yml' --exclude 'public/uploads' --exclude 'data'
          path: ./
          remote_path: /opt/b4bar/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Rebuild + redeploy no Swarm
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: bash /opt/b4bar/deploy/redeploy.sh
