<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#181818" />
  <title>B4 Bar — Área Interna</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
  <script>const _t=localStorage.getItem('b4_theme')||'dark';document.documentElement.setAttribute('data-theme',_t);</script>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a href="/" class="brand">
        <div class="brand-logo">B4</div>
        <div>
          <div class="brand-name">B4 Bar</div>
          <div class="brand-sub">Área Interna</div>
        </div>
      </a>
      <nav class="nav-tabs" id="mainNav" aria-label="Navegação"></nav>
    </div>
  </header>

  <main class="container">
    <div class="empty-state" id="loading">
      <div class="empty-state-icon">⏳</div>
      <div class="empty-state-title">Redirecionando...</div>
    </div>
  </main>

  <script src="/js/auth.js"></script>
  <script>
    (async () => {
      const user = await Auth.validate();
      Auth.buildNav();
      const order = [
        { perm: 'dashboard', path: '/dashboard' },
        { perm: 'produtos', path: '/admin' },
        { perm: 'funcionarios', path: '/funcionarios' },
        { perm: 'configuracoes', path: '/configuracoes' },
      ];
      const target = user && order.find(o => user.permissions.includes(o.perm));
      window.location.href = target ? target.path : '/login?redirect=/area-interna';
    })();
  </script>
</body>
</html>
