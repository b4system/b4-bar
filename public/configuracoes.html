<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#D2C8AC" />
  <title>B4 Bar — Configurações</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
  <script>const _t=localStorage.getItem('b4_theme')||'light';document.documentElement.setAttribute('data-theme',_t);</script>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a href="/" class="brand">
        <div class="brand-logo">B4</div>
        <div>
          <div class="brand-name">B4 Bar</div>
          <div class="brand-sub">Configurações</div>
        </div>
      </a>
      <nav class="nav-tabs" id="mainNav" aria-label="Navegação"></nav>
    </div>
  </header>

  <main class="container" id="pageContent" style="display:none;">
    <nav class="sub-tabs" id="subTabs" aria-label="Seções da Área Interna"></nav>

    <h1 class="page-title">Configurações</h1>
    <p class="page-subtitle">Personalize o fluxo de status dos pedidos.</p>

    <section class="dash-card" style="margin-top:18px;">
      <div class="dash-card-head">
        <div>
          <h3>Identificação de comandas</h3>
          <span class="dash-card-sub">Escolha quais tipos o garçom pode usar ao abrir um pedido.</span>
        </div>
      </div>
      <div class="comanda-config-list">
        <label class="perm-toggle">
          <input type="checkbox" value="mesa" id="ctMesa" />
          <span class="perm-label">🪑 Por número da mesa</span>
          <span class="perm-desc">Identificação numérica (ex: Mesa 12)</span>
        </label>
        <label class="perm-toggle">
          <input type="checkbox" value="nome" id="ctNome" />
          <span class="perm-label">👤 Por nome do cliente</span>
          <span class="perm-desc">Identificação por nome (ex: João Silva)</span>
        </label>
        <label class="perm-toggle">
          <input type="checkbox" value="codigo" id="ctCodigo" />
          <span class="perm-label">🎫 Por código da comanda</span>
          <span class="perm-desc">Comanda física com código (ex: Comanda #042)</span>
        </label>
      </div>
    </section>

    <section class="dash-card" style="margin-top:18px;">
      <div class="dash-card-head">
        <div>
          <h3>Status do pedido</h3>
          <span class="dash-card-sub">Ordem em que o pedido avança. "Cancelado" é sempre disponível.</span>
        </div>
        <button class="btn btn-primary btn-sm" id="newStatusBtn">+ Status</button>
      </div>
      <div class="status-config-list" id="statusList"></div>
    </section>
  </main>

  <!-- Modal de status -->
  <div class="modal-backdrop" id="statusModal">
    <div class="modal">
      <header class="modal-head">
        <h3 id="statusModalTitle">Novo status</h3>
        <button class="modal-close" id="closeStatusModal" aria-label="Fechar">&times;</button>
      </header>
      <div class="form-grid">
        <div class="field">
          <label for="statusName">Nome</label>
          <input id="statusName" type="text" placeholder="Ex: Em fila, Servindo, Pago" />
        </div>
        <div class="field">
          <label for="statusIcon">Ícone (emoji)</label>
          <input id="statusIcon" type="text" maxlength="4" placeholder="Ex: ⏱ 🍳 ✓ 📦" />
        </div>
        <div class="field">
          <label>Cor</label>
          <div class="color-picker" id="colorPicker">
            <button type="button" data-color="warn"><span class="color-swatch color-warn"></span>Alerta</button>
            <button type="button" data-color="info"><span class="color-swatch color-info"></span>Em andamento</button>
            <button type="button" data-color="success"><span class="color-swatch color-success"></span>Concluído</button>
            <button type="button" data-color="neutral"><span class="color-swatch color-neutral"></span>Neutro</button>
            <button type="button" data-color="danger"><span class="color-swatch color-danger"></span>Crítico</button>
            <button type="button" data-color="custom" id="customColorBtn">
              <span class="color-swatch" id="customSwatch" style="background:#9C27B0;"></span>Personalizado
            </button>
          </div>
          <input type="color" id="customColorInput" value="#9C27B0" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;" />
        </div>
      </div>
      <footer class="modal-foot">
        <button class="btn btn-ghost" id="cancelStatus">Cancelar</button>
        <button class="btn btn-primary" id="saveStatus">Salvar</button>
      </footer>
    </div>
  </div>

  <div class="toast-container" id="toasts"></div>

  <script src="/js/auth.js"></script>
  <script src="/js/configuracoes.js"></script>
</body>
</html>
