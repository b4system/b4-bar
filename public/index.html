<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F3EE" />
  <title>B4 Bar — Cardápio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
  <script>const _t=localStorage.getItem('b4_theme')||'light';document.documentElement.setAttribute('data-theme',_t);</script>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a href="/" class="brand">
        <div class="brand-logo">B4</div>
        <div>
          <div class="brand-name">B4 Bar</div>
          <div class="brand-sub">Casual · Drinks · Petiscos</div>
        </div>
      </a>
      <nav class="nav-tabs" id="mainNav" aria-label="Navegação"></nav>
    </div>
  </header>

  <main class="container">
    <div class="hero">
      <h1>Nosso Cardápio</h1>
      <p>Selecione uma categoria ou pesquise pelo nome do prato. Preços em reais (R$).</p>
    </div>

    <div class="search-bar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input id="search" type="search" placeholder="Buscar no cardápio..." autocomplete="off" />
    </div>

    <nav class="category-tabs" id="categoryTabs" aria-label="Categorias"></nav>

    <div id="menuContent"></div>
  </main>

  <div class="toast-container" id="toasts"></div>

  <script src="/js/auth.js"></script>
  <script src="/js/menu.js"></script>
</body>
</html>
