<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0c" />
  <title>B4 Bar — Pedidos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a href="/" class="brand">
        <div class="brand-logo">B4</div>
        <div>
          <div class="brand-name">B4 Bar</div>
          <div class="brand-sub">Pedidos em andamento</div>
        </div>
      </a>
      <nav class="nav-tabs" aria-label="Navegação">
        <a href="/" class="nav-tab">Cardápio</a>
        <a href="/garcom" class="nav-tab">Garçom</a>
        <a href="/pedidos" class="nav-tab active">Pedidos</a>
        <a href="/admin" class="nav-tab">Cadastro</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Pedidos</h1>
    <p class="page-subtitle">Atualiza automaticamente a cada 5 segundos.</p>

    <nav class="orders-filters" id="filters" aria-label="Filtros">
      <button class="category-chip active" data-status="">Todos</button>
      <button class="category-chip" data-status="pendente">⏱ Pendentes</button>
      <button class="category-chip" data-status="preparando">🍳 Preparando</button>
      <button class="category-chip" data-status="pronto">✓ Prontos</button>
      <button class="category-chip" data-status="entregue">📦 Entregues</button>
    </nav>

    <div id="ordersContent"></div>
  </main>

  <div class="toast-container" id="toasts"></div>

  <script src="/js/pedidos.js"></script>
</body>
</html>
