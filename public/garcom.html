<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#EFEBE0" />
  <title>B4 Bar — Garçom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
  <script>const _t=localStorage.getItem('b4_theme')||'light';document.documentElement.setAttribute('data-theme',_t);</script>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a href="/" class="brand">
        <div class="brand-logo">B4</div>
        <div>
          <div class="brand-name">B4 Bar</div>
          <div class="brand-sub">Área do Garçom</div>
        </div>
      </a>
      <nav class="nav-tabs" id="mainNav" aria-label="Navegação"></nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Anotar Pedido</h1>
    <p class="page-subtitle">Toque nos itens para adicionar. Confirme com a mesa preenchida.</p>

    <div class="garcom-layout">
      <!-- Itens do cardápio -->
      <section class="panel">
        <div class="panel-header">
          <div class="panel-title">
            <span>🍽️</span> Cardápio rápido
          </div>
          <div id="itemCount" style="font-size:13px;color:var(--text-2);">—</div>
        </div>
        <div class="panel-body">
          <div class="search-bar waiter-menu-search">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input id="waiterSearch" type="search" placeholder="Buscar item..." autocomplete="off" />
          </div>
          <nav class="waiter-categories" id="waiterCategories" aria-label="Categorias"></nav>
          <div class="waiter-items" id="waiterItems"></div>
        </div>
      </section>

      <!-- Carrinho / Pedido -->
      <aside class="panel cart" id="cart">
        <div class="panel-header" id="cartHeader">
          <div class="panel-title">
            <span>📋</span> Pedido <span id="cartCount" style="background:var(--accent);color:#1a1207;border-radius:999px;padding:2px 10px;font-size:13px;">0</span>
          </div>
        </div>
        <div class="panel-body" style="display:flex;flex-direction:column;gap:14px;">
          <div class="field">
            <label for="tableNumber">Mesa</label>
            <input id="tableNumber" type="text" inputmode="numeric" placeholder="Ex: 12" />
          </div>
        </div>
        <div id="cartItems" class="cart-items"></div>
        <div class="panel-body" style="padding-top:0;">
          <div class="field">
            <label for="notes">Observações (opcional)</label>
            <textarea id="notes" placeholder="Ex: sem gelo, sem cebola, ponto da carne..."></textarea>
          </div>
        </div>
        <div class="cart-footer">
          <div style="display:flex;gap:8px;">
            <button class="btn btn-ghost" id="clearCart" style="flex:0 0 auto;width:auto;padding:14px 16px;">Limpar</button>
            <button class="btn btn-primary" id="submitOrder" disabled>
              Enviar pedido
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </button>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <div class="toast-container" id="toasts"></div>

  <script src="/js/auth.js"></script>
  <script src="/js/garcom.js"></script>
</body>
</html>
