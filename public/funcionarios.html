<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F6F3EE" />
  <title>B4 Bar — Funcionários</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
  <script>const _t=localStorage.getItem('b4_theme')||'light';document.documentElement.setAttribute('data-theme',_t);</script>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a href="/" class="brand">
        <div class="brand-logo">B4</div>
        <div>
          <div class="brand-name">B4 Bar</div>
          <div class="brand-sub">Gestão de Funcionários</div>
        </div>
      </a>
      <nav class="nav-tabs" id="mainNav" aria-label="Navegação"></nav>
    </div>
  </header>

  <main class="container" id="pageContent" style="display:none;">
    <h1 class="page-title">Funcionários</h1>
    <p class="page-subtitle">Gerencie os acessos e permissões da equipe.</p>

    <div class="admin-toolbar">
      <div class="search-bar" style="flex:1;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="staffSearch" type="search" placeholder="Buscar funcionário..." autocomplete="off" />
      </div>
      <button class="btn btn-primary btn-sm" id="newStaffBtn">+ Funcionário</button>
    </div>

    <div class="staff-list" id="staffList"></div>
  </main>

  <!-- Modal de funcionário -->
  <div class="modal-backdrop" id="staffModal">
    <div class="modal modal-product">
      <header class="modal-head">
        <h3 id="staffModalTitle">Novo funcionário</h3>
        <button class="modal-close" id="closeStaffModal" aria-label="Fechar">&times;</button>
      </header>
      <div class="modal-scroll">
        <div class="form-grid">
          <div class="field">
            <label for="staffName">Nome completo</label>
            <input id="staffName" type="text" placeholder="Ex: João Silva" />
          </div>
          <div class="form-row-2">
            <div class="field">
              <label for="staffUsername">Usuário</label>
              <input id="staffUsername" type="text" placeholder="Ex: joao" autocomplete="off" />
            </div>
            <div class="field">
              <label for="staffRole">Cargo</label>
              <select id="staffRole">
                <option value="garcom">Garçom</option>
                <option value="cozinha">Cozinha</option>
                <option value="gerente">Gerente</option>
                <option value="admin">Administrador</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="staffPassword">Senha <span id="pwHint" style="font-weight:400;text-transform:none;letter-spacing:0;"></span></label>
            <input id="staffPassword" type="password" placeholder="Mínimo 4 caracteres" autocomplete="new-password" />
          </div>
          <div class="field">
            <label>Permissões de acesso</label>
            <div class="perm-grid" id="permGrid">
              <label class="perm-toggle">
                <input type="checkbox" value="cardapio" checked disabled />
                <span class="perm-label">Cardápio</span>
                <span class="perm-desc">Sempre ativo</span>
              </label>
              <label class="perm-toggle">
                <input type="checkbox" value="garcom" />
                <span class="perm-label">Garçom</span>
                <span class="perm-desc">Anotar pedidos</span>
              </label>
              <label class="perm-toggle">
                <input type="checkbox" value="pedidos" />
                <span class="perm-label">Pedidos</span>
                <span class="perm-desc">Painel de pedidos</span>
              </label>
              <label class="perm-toggle">
                <input type="checkbox" value="produtos" />
                <span class="perm-label">Produtos</span>
                <span class="perm-desc">Cadastro de mercadoria</span>
              </label>
              <label class="perm-toggle">
                <input type="checkbox" value="funcionarios" />
                <span class="perm-label">Funcionários</span>
                <span class="perm-desc">Gestão da equipe</span>
              </label>
            </div>
          </div>
        </div>
      </div>
      <footer class="modal-foot">
        <button class="btn btn-ghost" id="cancelStaff">Cancelar</button>
        <button class="btn btn-primary" id="saveStaff">Salvar</button>
      </footer>
    </div>
  </div>

  <div class="toast-container" id="toasts"></div>

  <script src="/js/auth.js"></script>
  <script src="/js/funcionarios.js"></script>
</body>
</html>
