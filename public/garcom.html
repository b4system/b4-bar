<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#181818" />
  <title>B4 Bar — Garçom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
  <script>const _t=localStorage.getItem('b4_theme')||'dark';document.documentElement.setAttribute('data-theme',_t);</script>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a href="/" class="brand">
        <div class="brand-logo">B4</div>
        <div>
          <div class="brand-name">B4 Bar</div>
          <div class="brand-sub">Área do Garçom</div>
        </div>
      </a>
      <nav class="nav-tabs" id="mainNav" aria-label="Navegação"></nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Anotar Pedido</h1>
    <p class="page-subtitle">Toque nos itens para adicionar. Confirme com a mesa preenchida.</p>

    <div class="garcom-layout">
      <!-- Itens do cardápio -->
      <section class="panel">
        <div class="panel-header">
          <div class="panel-title">
            <span>🍽️</span> Cardápio rápido
          </div>
          <div id="itemCount" style="font-size:13px;color:var(--text-2);">—</div>
        </div>
        <div class="panel-body">
          <div class="search-bar waiter-menu-search">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input id="waiterSearch" type="search" placeholder="Buscar item..." autocomplete="off" />
          </div>
          <nav class="waiter-categories" id="waiterCategories" aria-label="Categorias"></nav>
          <div class="waiter-items" id="waiterItems"></div>
        </div>
      </section>

      <!-- Carrinho / Pedido -->
      <aside class="panel cart" id="cart">
        <div class="panel-header" id="cartHeader">
          <div class="panel-title">
            <span>📋</span> Pedido <span id="cartCount" style="background:var(--accent);color:#1a1207;border-radius:999px;padding:2px 10px;font-size:13px;">0</span>
          </div>
        </div>
        <div class="panel-body" style="display:flex;flex-direction:column;gap:14px;">
          <div class="comanda-fields-block">
            <div class="comanda-fields-head">
              <label class="comanda-fields-label">Identificação da comanda</label>
              <span class="comanda-fields-hint">Preencha pelo menos um</span>
            </div>
            <div class="comanda-fields" id="comandaFields">
              <div class="field comanda-field" data-type="mesa">
                <label for="comandaMesa">🪑 Mesa</label>
                <input id="comandaMesa" type="text" inputmode="numeric" placeholder="Ex: 12" autocomplete="off" />
              </div>
              <div class="field comanda-field" data-type="nome">
                <label for="comandaNome">🪪 ID <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--text-2);">(nome, telefone ou CPF)</span></label>
                <div class="comanda-input-wrap">
                  <input id="comandaNome" type="text" placeholder="Ex: João, (11) 99999-0000" autocomplete="off" />
                  <span class="id-detect-badge" id="idDetectBadge"></span>
                </div>
              </div>
              <div class="field comanda-field" data-type="codigo">
                <label for="comandaCodigo">🎫 Código da comanda</label>
                <input id="comandaCodigo" type="text" placeholder="Ex: 042" autocomplete="off" />
              </div>
            </div>
          </div>
        </div>
        <div id="cartItems" class="cart-items"></div>
        <div class="panel-body" style="padding-top:0;">
          <button type="button" class="notes-btn" id="notesBtn">
            <span class="notes-btn-icon">💬</span>
            <span class="notes-btn-content">
              <span class="notes-btn-title" id="notesBtnTitle">Adicionar observação</span>
              <span class="notes-btn-preview" id="notesBtnPreview"></span>
            </span>
            <span class="notes-btn-action" id="notesBtnAction">+</span>
          </button>
          <textarea id="notes" style="display:none;"></textarea>
        </div>
        <div class="cart-footer">
          <div style="display:flex;gap:8px;">
            <button class="btn btn-ghost" id="clearCart" style="flex:0 0 auto;width:auto;padding:14px 16px;">Limpar</button>
            <button class="btn btn-primary" id="submitOrder" disabled>
              Enviar pedido
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </button>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <!-- Modal ao adicionar item: observação + adicionais -->
  <div class="modal-backdrop" id="obsModal">
    <div class="modal">
      <header class="modal-head">
        <h3 id="obsModalTitle">Adicionar ao pedido</h3>
        <button class="modal-close" id="closeObsModal" aria-label="Fechar">&times;</button>
      </header>
      <div class="modal-scroll">
        <div class="form-grid">
          <div class="obs-item-preview" id="obsItemPreview"></div>

          <div class="addons-section" id="obsAddonsSection" style="display:none;">
            <div class="addons-title">Adicionais</div>
            <div id="obsAddonsList"></div>
          </div>

          <div class="field" id="obsTextField">
            <label for="obsText">Observação <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--text-2);">(opcional)</span></label>
            <textarea id="obsText" rows="2" placeholder="Ex: sem cebola, ponto da carne, sem maionese..."></textarea>
          </div>
        </div>
      </div>
      <footer class="modal-foot">
        <button class="btn btn-ghost" id="obsCancel">Cancelar</button>
        <button class="btn btn-primary" id="obsAdd">
          Adicionar <span id="obsAddPrice" class="obs-add-price"></span>
        </button>
      </footer>
    </div>
  </div>

  <!-- Modal de observação geral do pedido -->
  <div class="modal-backdrop" id="orderNotesModal">
    <div class="modal">
      <header class="modal-head">
        <h3>Observação do pedido</h3>
        <button class="modal-close" id="closeOrderNotes" aria-label="Fechar">&times;</button>
      </header>
      <div class="form-grid">
        <div class="field">
          <label for="orderNotesText">Anote algo geral sobre o pedido inteiro</label>
          <textarea id="orderNotesText" rows="4" placeholder="Ex: sem gelo, sem cebola, levar guardanapos extras..."></textarea>
        </div>
      </div>
      <footer class="modal-foot">
        <button class="btn btn-ghost" id="orderNotesClear">Limpar</button>
        <button class="btn btn-primary" id="orderNotesSave">Salvar</button>
      </footer>
    </div>
  </div>

  <div class="toast-container" id="toasts"></div>

  <script src="/js/auth.js"></script>
  <script src="/js/garcom.js"></script>
</body>
</html>
