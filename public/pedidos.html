<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#EFEBE0" />
  <title>B4 Bar — Pedidos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
  <script>const _t=localStorage.getItem('b4_theme')||'light';document.documentElement.setAttribute('data-theme',_t);</script>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a href="/" class="brand">
        <div class="brand-logo">B4</div>
        <div>
          <div class="brand-name">B4 Bar</div>
          <div class="brand-sub">Pedidos em andamento</div>
        </div>
      </a>
      <nav class="nav-tabs" id="mainNav" aria-label="Navegação"></nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Pedidos</h1>
    <p class="page-subtitle">Atualiza automaticamente a cada 5 segundos.</p>

    <nav class="orders-filters" id="filters" aria-label="Filtros">
      <button class="category-chip active" data-status="">Todos</button>
      <button class="category-chip" data-status="pendente">⏱ Pendentes</button>
      <button class="category-chip" data-status="preparando">🍳 Preparando</button>
      <button class="category-chip" data-status="pronto">✓ Prontos</button>
      <button class="category-chip" data-status="entregue">📦 Entregues</button>
    </nav>

    <div id="ordersContent"></div>
  </main>

  <div class="toast-container" id="toasts"></div>

  <script src="/js/auth.js"></script>
  <script src="/js/pedidos.js"></script>
</body>
</html>
