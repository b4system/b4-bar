<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0c" />
  <title>B4 Bar — Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a href="/" class="brand">
        <div class="brand-logo">B4</div>
        <div>
          <div class="brand-name">B4 Bar</div>
          <div class="brand-sub">Acesso do funcionário</div>
        </div>
      </a>
      <nav class="nav-tabs" id="mainNav" aria-label="Navegação"></nav>
    </div>
  </header>

  <main class="container" style="display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 200px);padding-bottom:40px;">
    <div class="login-card">
      <div class="login-header">
        <div class="brand-logo" style="width:56px;height:56px;font-size:28px;border-radius:16px;margin:0 auto 16px;">B4</div>
        <h1>Entrar</h1>
        <p>Acesse com suas credenciais de funcionário</p>
      </div>
      <form id="loginForm" class="form-grid">
        <div class="field">
          <label for="username">Usuário</label>
          <input id="username" type="text" placeholder="Seu nome de usuário" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input id="password" type="password" placeholder="Sua senha" autocomplete="current-password" required />
        </div>
        <div id="loginError" class="login-error" style="display:none;"></div>
        <button type="submit" class="btn btn-primary" id="loginBtn">Entrar</button>
      </form>
      <div class="login-footer">
        <a href="/">Voltar ao cardápio</a>
      </div>
    </div>
  </main>

  <div class="toast-container" id="toasts"></div>

  <script src="/js/auth.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
