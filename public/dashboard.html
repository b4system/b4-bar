<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#D2C8AC" />
  <title>B4 Bar — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
  <script>const _t=localStorage.getItem('b4_theme')||'light';document.documentElement.setAttribute('data-theme',_t);</script>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a href="/" class="brand">
        <div class="brand-logo">B4</div>
        <div>
          <div class="brand-name">B4 Bar</div>
          <div class="brand-sub">Dashboard</div>
        </div>
      </a>
      <nav class="nav-tabs" id="mainNav" aria-label="Navegação"></nav>
    </div>
  </header>

  <main class="container" id="pageContent" style="display:none;">
    <nav class="sub-tabs" id="subTabs" aria-label="Seções da Área Interna"></nav>
    <div class="dash-head">
      <div>
        <h1 class="page-title">Resumo de Vendas</h1>
        <p class="page-subtitle" id="periodLabel">Hoje</p>
      </div>
      <nav class="dash-range" id="rangeTabs" aria-label="Período">
        <button class="dash-range-btn active" data-range="today">Hoje</button>
        <button class="dash-range-btn" data-range="7d">7 dias</button>
        <button class="dash-range-btn" data-range="30d">30 dias</button>
      </nav>
    </div>

    <!-- KPI cards -->
    <section class="kpi-grid">
      <article class="kpi-card kpi-primary">
        <div class="kpi-icon">💰</div>
        <div class="kpi-meta">
          <div class="kpi-label">Faturamento</div>
          <div class="kpi-value" id="kpiRevenue">R$ 0,00</div>
        </div>
      </article>
      <article class="kpi-card">
        <div class="kpi-icon">🧾</div>
        <div class="kpi-meta">
          <div class="kpi-label">Pedidos</div>
          <div class="kpi-value" id="kpiOrders">0</div>
        </div>
      </article>
      <article class="kpi-card">
        <div class="kpi-icon">📊</div>
        <div class="kpi-meta">
          <div class="kpi-label">Ticket médio</div>
          <div class="kpi-value" id="kpiAvg">R$ 0,00</div>
        </div>
      </article>
      <article class="kpi-card">
        <div class="kpi-icon">🍽️</div>
        <div class="kpi-meta">
          <div class="kpi-label">Itens vendidos</div>
          <div class="kpi-value" id="kpiItems">0</div>
        </div>
      </article>
    </section>

    <!-- Status dos pedidos -->
    <section class="dash-section">
      <h2 class="dash-section-title">Status dos pedidos</h2>
      <div class="status-grid" id="statusGrid"></div>
    </section>

    <!-- Pedidos atrasados -->
    <section class="dash-section" id="lateSection" style="display:none;">
      <h2 class="dash-section-title late-title">⚠ Pedidos atrasados <span id="lateCount" class="late-count">0</span></h2>
      <div class="late-list" id="lateList"></div>
    </section>

    <!-- Gráficos -->
    <section class="dash-grid">
      <article class="dash-card">
        <div class="dash-card-head">
          <h3 id="chartTimeTitle">Vendas por hora</h3>
        </div>
        <div class="chart-wrap">
          <canvas id="chartTime"></canvas>
        </div>
      </article>

      <article class="dash-card">
        <div class="dash-card-head">
          <h3>Vendas por categoria</h3>
        </div>
        <div class="chart-wrap">
          <canvas id="chartCategory"></canvas>
        </div>
        <div class="legend-list" id="categoryLegend"></div>
      </article>
    </section>

    <!-- Top produtos + garçons -->
    <section class="dash-grid">
      <article class="dash-card">
        <div class="dash-card-head">
          <h3>Top 10 produtos</h3>
          <span class="dash-card-sub" id="topItemsCount"></span>
        </div>
        <div class="top-list" id="topItemsList"></div>
      </article>

      <article class="dash-card">
        <div class="dash-card-head">
          <h3>Top garçons</h3>
        </div>
        <div class="top-list" id="topWaitersList"></div>
      </article>
    </section>
  </main>

  <div class="toast-container" id="toasts"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
